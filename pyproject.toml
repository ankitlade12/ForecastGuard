[project]
name = "forecastguard"
version = "0.1.0"
description = "The quality gate for forecasting backtests — before a model-selection agent trusts them."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Ankit Hemant Lade", email = "ankitlade12@gmail.com" },
]
keywords = ["forecasting", "leakage", "backtest", "nixtla", "ci", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "click>=8.1.0,<9.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
    "types-pyyaml>=6.0.12",
]
parquet = ["pyarrow>=15.0.0"]
nixtla = ["mlforecast>=1.0.0"]

[project.scripts]
forecastguard = "forecastguard.cli:app"

[project.urls]
Homepage = "https://github.com/ankitlade12/ForecastGuard"
Repository = "https://github.com/ankitlade12/ForecastGuard"
Documentation = "https://github.com/ankitlade12/ForecastGuard/tree/main/docs"
Changelog = "https://github.com/ankitlade12/ForecastGuard/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecastguard"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.github",
    "/.pre-commit-config.yaml",
    "/.python-version",
    "/AGENTS.md",
    "/ForecastGuard-CI-OnePager.docx",
    "/HANDOFF.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["forecastguard", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["forecastguard", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*", "yaml.*", "numpy.*", "mlforecast.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: fast, isolated unit tests",
    "contract: Check-protocol conformance tests",
    "integration: tests that exercise the runner + CLI end to end",
]
