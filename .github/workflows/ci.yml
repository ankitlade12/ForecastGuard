name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: |
          uv run --extra dev --python ${{ matrix.python-version }} ruff check forecastguard/ tests/
          uv run --extra dev --python ${{ matrix.python-version }} ruff format --check forecastguard/ tests/

      - name: Type-check (mypy strict)
        run: uv run --extra dev --python ${{ matrix.python-version }} mypy forecastguard/

      - name: Test (pytest)
        run: uv run --extra dev --python ${{ matrix.python-version }} pytest

  conclude:
    name: conclude
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Gate on the matrix result
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "All checks passed."
            exit 0
          else
            echo "One or more checks failed."
            exit 1
          fi
