name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: |
          uv run --extra dev --python ${{ matrix.python-version }} ruff check forecastguard/ tests/
          uv run --extra dev --python ${{ matrix.python-version }} ruff format --check forecastguard/ tests/

      - name: Type-check (mypy strict)
        run: uv run --extra dev --python ${{ matrix.python-version }} mypy forecastguard/ tests/

      - name: Test (pytest)
        run: uv run --extra dev --python ${{ matrix.python-version }} pytest --cov=forecastguard --cov-report=term-missing

      - name: Build distributions
        run: uv build

      - name: Real MLForecast integration and generated onboarding
        run: |
          uv run --extra dev --extra nixtla --python ${{ matrix.python-version }} pytest tests/integration/test_mlforecast_real.py tests/integration/test_adoption_workflow.py
          uv run --extra dev --extra nixtla --python ${{ matrix.python-version }} python examples/python_api/mlforecast_example.py

      - name: Verify wheel and sdist metadata
        run: uvx twine check dist/*

      - name: Test installed Python library
        run: |
          uv venv "$RUNNER_TEMP/forecastguard-wheel" --python ${{ matrix.python-version }}
          uv pip install --python "$RUNNER_TEMP/forecastguard-wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/forecastguard-wheel/bin/python" -I examples/python_api/pandas_example.py

      - name: Action-equivalent CLI smoke
        run: |
          uv run --extra dev --python ${{ matrix.python-version }} forecastguard run \
            --spec examples/runtime_leakage/clean.yaml --strict --github \
            --json-output forecastguard-report.json \
            --sarif-output forecastguard-report.sarif

      - name: Upload smoke reports
        uses: actions/upload-artifact@v4
        with:
          name: forecastguard-${{ matrix.python-version }}
          path: forecastguard-report.*

  conclude:
    name: conclude
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Gate on the matrix result
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "All checks passed."
            exit 0
          else
            echo "One or more checks failed."
            exit 1
          fi
