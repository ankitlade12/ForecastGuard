name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra nixtla --python 3.12
      - run: uv run --no-sync pytest
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from forecastguard import __version__

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == __version__, "source package versions disagree"
          assert os.environ["RELEASE_TAG"] == f"v{version}", "release tag does not match version"
          PY
      - name: Build and check distributions
        run: |
          uv build
          uvx twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          uv venv "$RUNNER_TEMP/forecastguard-release" --python 3.12
          uv pip install --python "$RUNNER_TEMP/forecastguard-release/bin/python" dist/*.whl
          "$RUNNER_TEMP/forecastguard-release/bin/python" -I examples/python_api/pandas_example.py
      - name: Save verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  pypi-publish:
    name: Publish verified distributions to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/forecastguard
    permissions:
      id-token: write  # mandatory for PyPI trusted publishing
      contents: read
    needs: verify

    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
