name: "ForecastGuard CI"
description: "Validate a forecasting pipeline before its backtest is trusted — cutoff integrity, known-future covariates, runtime leakage."
author: "Ankit Hemant Lade"
branding:
  icon: "shield"
  color: "blue"

inputs:
  spec:
    description: "Path to the forecastguard.yaml spec."
    required: false
    default: "forecastguard.yaml"
  strict:
    description: "Treat loud skips (e.g. no feature_fn) as failures."
    required: false
    default: "false"
  version:
    description: "ForecastGuard version specifier to install (e.g. '==0.1.0')."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ForecastGuard
      shell: bash
      run: python -m pip install --upgrade "forecastguard${{ inputs.version }}"

    - name: Run ForecastGuard
      shell: bash
      run: |
        forecastguard run --spec "${{ inputs.spec }}" ${{ inputs.strict == 'true' && '--strict' || '' }}
