name: "ForecastGuard CI"
description: "Validate a forecasting pipeline before its backtest is trusted — cutoff integrity, known-future covariates, runtime leakage."
author: "Ankit Hemant Lade"
branding:
  icon: "shield"
  color: "blue"

inputs:
  spec:
    description: "Path to the forecastguard.yaml spec."
    required: false
    default: "forecastguard.yaml"
  strict:
    description: "Treat loud skips (e.g. no feature_fn) as failures."
    required: false
    default: "false"
  version:
    description: "Optional PyPI version specifier to install (e.g. '==0.1.0'). Empty installs this action checkout."
    required: false
    default: ""
  json-output:
    description: "Path for the versioned JSON report artifact."
    required: false
    default: "forecastguard-report.json"
  sarif-output:
    description: "Path for the SARIF 2.1.0 report artifact."
    required: false
    default: "forecastguard-report.sarif"
  artifact-name:
    description: "Name of the uploaded JSON + SARIF artifact."
    required: false
    default: "forecastguard-report"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ForecastGuard from this action
      if: ${{ inputs.version == '' }}
      shell: bash
      run: python -m pip install --upgrade "$GITHUB_ACTION_PATH"

    - name: Install ForecastGuard from PyPI
      if: ${{ inputs.version != '' }}
      shell: bash
      env:
        FG_VERSION: ${{ inputs.version }}
      run: python -m pip install --upgrade "forecastguard${FG_VERSION}"

    - name: Run ForecastGuard
      shell: bash
      env:
        FG_SPEC: ${{ inputs.spec }}
        FG_STRICT: ${{ inputs.strict }}
        FG_JSON_OUTPUT: ${{ inputs.json-output }}
        FG_SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: |
        args=(--spec "$FG_SPEC" --github --json-output "$FG_JSON_OUTPUT" --sarif-output "$FG_SARIF_OUTPUT")
        if [ "$FG_STRICT" = "true" ]; then
          args+=(--strict)
        fi
        forecastguard run "${args[@]}"

    - name: Upload ForecastGuard reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.json-output }}
          ${{ inputs.sarif-output }}
        if-no-files-found: error
